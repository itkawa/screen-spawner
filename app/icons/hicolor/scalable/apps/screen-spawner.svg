<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9152f2"/>
      <stop offset="1" stop-color="#3a0f82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#e2c6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e2c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1bac"/>
      <stop offset="1" stop-color="#290b63"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>

    <!-- A second monitor, lower and further away: more screens, one per device -->
    <rect x="146" y="128" width="94" height="68" rx="11" fill="url(#screen)" stroke="#ffffff" stroke-width="10" opacity="0.9"/>
    <rect x="186" y="196" width="14" height="17" fill="#ffffff" opacity="0.9"/>
    <rect x="168" y="210" width="50" height="10" rx="5" fill="#ffffff" opacity="0.9"/>

    <!-- The monitor being added, with the plus, half behind the penguin -->
    <rect x="52" y="30" width="132" height="96" rx="14" fill="url(#screen)" stroke="#ffffff" stroke-width="12"/>
    <path d="M127 50 h14 a4 4 0 0 1 4 4 v18 h18 a4 4 0 0 1 4 4 v14 a4 4 0 0 1-4 4 h-18 v18 a4 4 0 0 1-4 4 h-14 a4 4 0 0 1-4-4 v-18 h-18 a4 4 0 0 1-4-4 v-14 a4 4 0 0 1 4-4 h18 v-18 a4 4 0 0 1 4-4z" fill="#ffffff"/>

    <!-- Penguin: round dark head, white two-lobed face, orange beak, happy eyes -->
    <circle cx="84" cy="188" r="76" fill="#ffffff"/>
    <circle cx="84" cy="188" r="69" fill="#1b0f2e"/>
    <g fill="#ffffff">
      <circle cx="63" cy="182" r="25"/>
      <circle cx="105" cy="182" r="25"/>
      <ellipse cx="84" cy="218" rx="47" ry="41"/>
    </g>
    <path d="M52 180 q11 -12 22 0" fill="none" stroke="#1b0f2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M94 180 q11 -12 22 0" fill="none" stroke="#1b0f2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M65 195 h38 q-6 21 -19 21 q-13 0 -19 -21z" fill="#ffa21f" stroke="#e57a00" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
