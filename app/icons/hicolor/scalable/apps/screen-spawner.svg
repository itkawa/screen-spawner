<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9152f2"/>
      <stop offset="1" stop-color="#3a0f82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#e2c6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e2c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1bac"/>
      <stop offset="1" stop-color="#290b63"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Background with a soft glow behind the monitor -->
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>

    <!-- Monitor with a thick white frame, so it survives being shrunk -->
    <rect x="96" y="40" width="132" height="96" rx="14" fill="url(#screen)" stroke="#ffffff" stroke-width="12"/>
    <rect x="182" y="136" width="18" height="24" fill="#ffffff"/>
    <rect x="160" y="158" width="62" height="12" rx="6" fill="#ffffff"/>

    <!-- The plus: a new screen appears -->
    <path d="M155 60 h14 a4 4 0 0 1 4 4 v18 h18 a4 4 0 0 1 4 4 v14 a4 4 0 0 1-4 4 h-18 v18 a4 4 0 0 1-4 4 h-14 a4 4 0 0 1-4-4 v-18 h-18 a4 4 0 0 1-4-4 v-14 a4 4 0 0 1 4-4 h18 v-18 a4 4 0 0 1 4-4z" fill="#ffffff"/>

    <!-- Penguin: round dark head, white two-lobed face, orange beak, happy eyes -->
    <circle cx="92" cy="184" r="80" fill="#ffffff"/>
    <circle cx="92" cy="184" r="73" fill="#1b0f2e"/>
    <g fill="#ffffff">
      <circle cx="70" cy="178" r="27"/>
      <circle cx="114" cy="178" r="27"/>
      <ellipse cx="92" cy="216" rx="50" ry="44"/>
    </g>
    <path d="M58 176 q12 -13 24 0" fill="none" stroke="#1b0f2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M102 176 q12 -13 24 0" fill="none" stroke="#1b0f2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 192 h40 q-6 22 -20 22 q-14 0 -20 -22z" fill="#ffa21f" stroke="#e57a00" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
